# ==============================================================================
# Optional Caddy Reverse Proxy Addon for CineStream
# ==============================================================================
# Use this file ONLY if you do not have an existing reverse proxy (Caddy, NPM, Traefik)
# and want CineStream to automatically handle ports 80/443 and Let's Encrypt SSL.
#
# Usage with Docker Compose:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
# ==============================================================================

services:
  caddy:
    image: caddy:2-alpine
    container_name: cinestream-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      - DUCKDNS_SUBDOMAIN=${DUCKDNS_SUBDOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$DUCKDNS_SUBDOMAIN" ] && [ "$$DUCKDNS_SUBDOMAIN" != "mycinestream" ] && [ "$$DUCKDNS_SUBDOMAIN" != "yoursubdomain" ]; then
          cat <<EOF > /etc/caddy/Caddyfile
        {
            email admin@cinestream.local
        }
        $${DUCKDNS_SUBDOMAIN}.duckdns.org {
            # Route AIOStreams manifest and scraping traffic directly
            handle /stremio* {
                reverse_proxy aiostreams:3000
            }
            handle /api/v1/* {
                reverse_proxy aiostreams:3000
            }

            # Zero-buffer multi-thread proxy & local NAS streaming for Stremio over HTTPS
            handle /proxy/* {
                reverse_proxy cinestream:3000 {
                    flush_interval -1
                }
            }
            handle /api/nas/stream/* {
                reverse_proxy cinestream:3000 {
                    flush_interval -1
                }
            }

            # CineStream Stremio Addon (/cs-stremio/*), API, and Web Control Center
            handle {
                reverse_proxy cinestream:3000
            }
        }
        :80 {
            handle /stremio* {
                reverse_proxy aiostreams:3000
            }
            handle /proxy/* {
                reverse_proxy cinestream:3000 {
                    flush_interval -1
                }
            }
            handle /api/nas/stream/* {
                reverse_proxy cinestream:3000 {
                    flush_interval -1
                }
            }
            handle {
                reverse_proxy cinestream:3000
            }
        }
        EOF
        else
          cat <<EOF > /etc/caddy/Caddyfile
        :80 {
            reverse_proxy cinestream:3000
        }
        EOF
        fi
        caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - cinestream_net
    depends_on:
      - cinestream

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local

